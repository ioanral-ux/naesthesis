:root{--bg:#F4F6F3;--tx:#24302C;--sub:#4F5F59;--cd:#fff;--bd:#C9D6CF;--ac:#3F6B66;--sf:#DCE8E2;--on:#fff;--w1:#FBF3E8;--w1b:#E3CFB1;--w2:#F3DDBF;--w2b:#9A6122;--w3:#3B2A12;--w4:#fff;--nb:#DDE5E0;--g:#3F6B66;--n:#BFD5CC;--h:#8A5A78;--p:#F3E3E0;--ch:#F4F6F3;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html[data-theme=afternoon]{--bg:#F8EEE6;--tx:#3A2A22;--sub:#6B5446;--cd:#FFFBF7;--bd:#E6CDBB;--ac:#A4522F;--sf:#F1D5C3;--w1:#EAEFE4;--w1b:#C8D3BC;--w2:#D3DEC4;--w2b:#4E6B3A;--w3:#23301A;--w4:#F6F8F2;--nb:#EBD8CA;--g:#A4522F;--n:#E6CDBB;--h:#6E4A66;--p:#F0CFC8;--ch:#F8EEE6}
html[data-theme=night]{--bg:#232B3A;--tx:#ECEFF4;--sub:#AEB8C8;--cd:#2E3748;--bd:#43506A;--ac:#8FB8B0;--sf:#3B5A57;--on:#14201E;--w1:#3A3448;--w1b:#594F70;--w2:#7A5C3A;--w2b:#E8B87A;--w3:#F3E6D3;--w4:#2E2A3C;--nb:#43506A;--g:#8FB8B0;--n:#5B6B86;--h:#C79BB8;--p:#4A3A48;--ch:#232B3A}
body{margin:0;background:var(--bg);color:var(--tx);font:16px 'Noto Sans',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip}
.pg{flex:1;padding:28px 20px 20px;display:flex;flex-direction:column;gap:16px}
h1{font:500 26px/1.3 'Noto Serif',serif;margin:0}
.sub{color:var(--sub)}p.sub{font-size:15px;margin:6px 0 0}
.c{background:var(--cd);background:color-mix(in srgb,var(--cd) 76%,transparent);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.c.w{background:var(--w1);background:color-mix(in srgb,var(--w1) 76%,transparent)}.t{font-weight:600;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,input,textarea{font:inherit;color:inherit}
.ch{min-height:44px;padding:0 15px;border-radius:22px;border:1px solid var(--bd);background:var(--ch);font-size:14px;cursor:pointer}
.ch.s{border:2px solid var(--ac);background:var(--sf);font-weight:600}
.w .ch{border-color:var(--w1b);background:var(--w4)}.w .ch.s{border:2px solid var(--w2b);background:var(--w2);color:var(--w3)}
.mo{display:flex;gap:6px}.mo .ch{flex:1;min-width:0;min-height:64px;border-radius:14px;padding:0 2px;background:var(--cd);font-size:12px}
.btn{min-height:52px;border:0;border-radius:26px;background:var(--ac);color:var(--on);font-size:16px;font-weight:600;cursor:pointer}
.btn.o{background:none;border:2px solid var(--ac);color:var(--ac)}
.lk{min-height:44px;border:0;background:none;color:var(--ac);text-decoration:underline;font-size:15px;cursor:pointer;padding:0 6px}
.sr{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:8px}
.dt{display:flex}.dt button{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dt i{width:26px;height:26px;border-radius:50%;background:var(--sf)}.dt i.f{background:var(--ac)}
.in{min-height:48px;border:1px solid var(--bd);border-radius:12px;padding:0 14px;font-size:16px;background:var(--ch);width:100%;box-sizing:border-box}
nav{position:sticky;bottom:0;height:64px;display:flex;background:var(--cd);border-top:1px solid var(--nb);font-size:13px}
nav button{flex:1;border:0;background:none;color:var(--sub);cursor:pointer}nav .s{color:var(--ac);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal button{min-height:50px;border:2px solid transparent;border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;cursor:pointer}
.cal .p{background:var(--p)}.cal .td{border-color:var(--ac)}.cal button:disabled{opacity:.4;cursor:default}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.seg{display:flex;background:var(--sf);border-radius:24px;padding:4px}.seg button{flex:1;min-height:44px;border:0;border-radius:20px;background:none;color:var(--ac);font-size:15px;cursor:pointer}.seg .s{background:var(--ac);color:var(--on);font-weight:600}
.gt{fill:var(--sub);font-size:11px}.gl{stroke:var(--nb)}.gp{fill:var(--p)}.gv{fill:none;stroke:var(--ac);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.gd{fill:var(--ac);opacity:.45}.mg{fill:var(--g)}.mn{fill:var(--n)}.mh{fill:var(--h)}
.a4{background:#fff;color:#24302C;border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.a4 input{border:0;border-bottom:1px solid #C9D6CF;background:none;font-size:14px;min-width:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:fi .2s ease-out}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.ov.out{opacity:0;transition:opacity .18s}.sh.out{opacity:0;transform:translate(-50%,-48%) scale(.97);transition:opacity .18s,transform .18s}
@media (prefers-reduced-motion:reduce){.ov,.sh{animation:none}.ov.out,.sh.out{transition:none}}

</style></head><body><div id="app"></div><script>
const A=document.getElementById('app');
const K=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const D=k=>{const[a,b,c]=k.split('-');return new Date(+a,b-1,+c)};
const addD=(k,n)=>{const d=D(k);d.setDate(d.getDate()+n);return K(d)};
const TD=()=>K(new Date());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SY={flush:'Εξάψεις',sleep:'Ύπνος',mood:'Διάθεση',fat:'Κόπωση',pain:'Πόνοι αρθρώσεων',fog:'Ομίχλη στη σκέψη',dry:'Ξηρότητα',lib:'Σεξουαλική επιθυμία'};
const LV=['','Ήπιο','Μέτριο','Έντονο','Πολύ έντονο'];
const MO={VD:'Πολύ δύσκολη',D:'Δύσκολη',N:'Έτσι κι έτσι',G:'Καλή',VG:'Πολύ καλή'},MC={VG:'g',G:'g',N:'n',D:'h',VD:'h'},MP={G:.6,D:.6};
const PE=['Όχι','Κηλίδες','Ελαφριά','Μέτρια','Έντονη'];
let inf=null,pop=0,pmsg='',intro=1,introC='';
const INFO={
flush:[`Εξάψεις και νυχτερινοί ιδρώτες`,`Πολλές γυναίκες νιώθουν ξαφνικά κύματα ζέστης, ιδρώτα ή ερυθρότητα. Μία εξήγηση είναι ότι, καθώς αλλάζουν οι ορμόνες, ο «θερμοστάτης» του εγκεφάλου, που ρυθμίζει τη θερμοκρασία του σώματος, γίνεται πιο ευαίσθητος. Έτσι, ακόμα και μια μικρή άνοδος της θερμοκρασίας μπορεί να κάνει το σώμα να αντιδράσει σαν να υπερθερμαίνεται. Η συχνότητα και η ένταση διαφέρουν πολύ από γυναίκα σε γυναίκα.`],
sleep:[`Ύπνος`,`Οι αλλαγές στον ύπνο είναι συχνές σε αυτή τη φάση. Ένας λόγος μπορεί να είναι οι νυχτερινοί ιδρώτες, που διακόπτουν τον ύπνο. Οι ορμονικές αλλαγές φαίνεται επίσης ότι επηρεάζουν τον τρόπο που το σώμα ρυθμίζει τη θερμοκρασία και τον ύπνο, αν και οι έρευνες δεν συμφωνούν πάντα ως προς το πόσο. Στον ύπνο παίζουν ρόλο και το άγχος, η διάθεση και η ηλικία.`],
mood:[`Διάθεση και άγχος`,`Πολλές γυναίκες παρατηρούν περισσότερη ευερεθιστότητα, άγχος ή πεσμένη διάθεση σε αυτή τη φάση. Οι επιστήμονες πιστεύουν ότι έχουν σημασία οι διακυμάνσεις των ορμονών, και όχι μόνο τα επίπεδά τους, και ότι αυτές μπορεί να επηρεάζουν ουσίες του εγκεφάλου που σχετίζονται με τη διάθεση. Παίζουν ρόλο και άλλοι παράγοντες: ο ύπνος, οι εξάψεις, οι πιέσεις της καθημερινότητας και το ιστορικό της κάθε γυναίκας. Αν η διάθεση σε βαραίνει πολύ ή για αρκετό διάστημα, αξίζει να το πεις σε κάποιον που εμπιστεύεσαι ή στον γιατρό σου.`],
fog:[`«Ομίχλη» στη σκέψη`,`Πολλές γυναίκες περιγράφουν δυσκολίες με τη συγκέντρωση ή με τη μνήμη. Έρευνες δείχνουν ότι στη μετάβαση μπορεί να υπάρχει μια προσωρινή, μικρή αλλαγή στη μνήμη και στην ταχύτητα σκέψης, που στις περισσότερες γυναίκες βελτιώνεται αργότερα. Ο κακός ύπνος, οι εξάψεις και η κούραση μπορούν να την ενισχύσουν. Αν σε ανησυχεί, αξίζει να το συζητήσεις με τον γιατρό σου.`],
pain:[`Πόνοι στις αρθρώσεις`,`Οι πόνοι ή η δυσκαμψία στις αρθρώσεις είναι συχνοί στη μέση ηλικία. Οι ορμονικές αλλαγές ίσως παίζουν ρόλο στο πώς το σώμα ρυθμίζει τη φλεγμονή και τον πόνο, αλλά οι αποδείξεις είναι περιορισμένες. Συμβάλλουν επίσης η ηλικία και η καθημερινή φόρτιση των αρθρώσεων.`],
dry:[`Ξηρότητα και ουρογεννητικά συμπτώματα`,`Ξηρότητα, ερεθισμός, πόνος στη σεξουαλική επαφή ή συχνουρία μπορεί να εμφανιστούν όσο μειώνονται τα οιστρογόνα, επειδή οι ιστοί της περιοχής είναι ευαίσθητοι σε αυτά και γίνονται πιο λεπτοί και ξηροί. Σε αντίθεση με τις εξάψεις, αυτά τα συμπτώματα τείνουν να παραμένουν ή να αυξάνονται με τον χρόνο. Είναι πολύ συχνά, και αξίζει να τα αναφέρεις ελεύθερα στον γιατρό σου.`],
lib:[`Σεξουαλική επιθυμία`,`Η σεξουαλική επιθυμία επηρεάζεται από πολλά πράγματα. Οι ορμονικές αλλαγές μπορεί να παίζουν ρόλο, αλλά οι έρευνες δείχνουν ότι συχνά μετράνε περισσότερο ο ύπνος, η διάθεση, η κούραση, ο πόνος στην επαφή και η σχέση με τον σύντροφο. Δεν υπάρχει «σωστό» επίπεδο επιθυμίας.`],
fat:[`Κούραση`,`Η κούραση είναι από τα πιο συχνά παράπονα. Συχνά συνδέεται με τον διαταραγμένο ύπνο, τις εξάψεις και τη διάθεση, και όχι με κάποια ξεχωριστή ορμονική αιτία. Επειδή μπορεί να έχει πολλές αιτίες, αν είναι έντονη ή επίμονη αξίζει να τη συζητήσεις με τον γιατρό σου.`],
per:[`Αλλαγές στον κύκλο και στη ροή`,`Στην περιεμμηνόπαυση οι ωοθήκες αρχίζουν να λειτουργούν πιο ακανόνιστα. Έτσι ο κύκλος μπορεί να γίνει πιο μικρός, πιο μεγάλος ή άτακτος και η ροή πιο ελαφριά ή πιο έντονη. Η ακανόνιστη περίοδος είναι συχνή σε αυτή τη φάση. Πολύ έντονη ή παρατεταμένη αιμορραγία, ή αιμορραγία μετά από μήνες χωρίς περίοδο, αξίζει να ελέγχεται από γιατρό.`]};
const sheet=()=>{const i=INFO[inf];return i?`<div class="ov" data-a="x"></div><div class="sh" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="shh"><h2 id="sht">${i[0]}</h2><button id="shc" class="lk" data-a="x">Κλείσιμο</button></div><p>${i[1]}</p><p class="sub" style="font-size:13px">Αυτές είναι γενικές πληροφορίες και όχι ιατρική συμβουλή ή διάγνωση. Κάθε γυναίκα βιώνει αυτή τη φάση διαφορετικά. Η εφαρμογή δεν αντικαθιστά τον γιατρό.</p></div>`:''};
const HE=['Κίνηση','Ξεκούραση','Φύση','Παρέα','Λίγος χρόνος για μένα'];
let S;try{S=JSON.parse(localStorage.getItem('dv1'))}catch(e){}
S=Object.assign({name:'',theme:'auto',seen:0,days:{},rep:{}},S||{});
Object.values(S.days).forEach(d=>{if(d.mood=='B')d.mood='D'});
const sv=()=>{try{localStorage.setItem('dv1',JSON.stringify(S))}catch(e){}};
let scr='splash',last='',cur,dr,from='splash',gs='flush',gr=30,cm=new Date(),del=0;cm.setDate(1);
const open=k=>{cur=k;dr=JSON.parse(JSON.stringify(S.days[k]||{}));dr.sym=dr.sym||{};dr.help=dr.help||[]};open(TD());
const hr=()=>new Date().getHours();
const th=()=>S.theme!='auto'?S.theme:hr()>=5&&hr()<12?'morning':hr()>=12&&hr()<21?'afternoon':'night';
const gt=()=>hr()>=5&&hr()<12?['Καλημέρα','Πώς ξεκίνησε η μέρα σου;']:hr()>=12&&hr()<21?['Καλησπέρα','Πώς είναι η μέρα σου μέχρι τώρα;']:['Καλησπέρα','Πώς ήταν η μέρα σου σήμερα;'];
const dots=(k,v)=>`<span class="dt">${[1,2,3,4].map(i=>`<button aria-label="${LV[i]}" data-a="lv" data-k="${k}" data-v="${i}"><i class="${i<=v?'f':''}"></i></button>`).join('')}</span>`;
const chip=(t,a,s,x='')=>`<button class="ch${s?' s':''}" data-a="${a}" ${x}>${t}</button>`;
const val=(d,k)=>{if(!d)return null;const s=d.sym||{},n=Object.keys(s).length;if(k=='all')return n?Object.values(s).reduce((a,b)=>a+b)/n:(d.none?0:null);return k in s?s[k]:(d.none||n?0:null)};
function msg(d){const k=Object.keys(d.sym||{}),n=k.length,mx=Math.max(0,...k.map(x=>d.sym[x]));
 const l=d.none?0:n==0?-1:(n>=3||mx>=4)?2:1,m=d.mood;
